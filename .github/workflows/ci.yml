name: CircuitMind CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v --tb=short --cov=app --cov-report=term-missing

      - name: Check no import errors
        run: |
          python -c "from app.analyzer import analyze_circuit; print('✅ analyzer import OK')"
          python -c "from app.generator import generate_design; print('✅ generator import OK')"
          python -c "from app.main import app; print('✅ FastAPI app import OK')"
